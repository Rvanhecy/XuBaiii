<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.aplayer-list {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: relative !important;
}
.aplayer-list-wrap {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
}
.aplayer-list::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list-wrap::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list li {
    height: 32px !important;
    line-height: 32px !important;
}
.aplayer {
    overflow: visible !important;
}
.aplayer-withlrc {
    overflow: visible !important;
}

/* 手机端与电脑端完全一致：默认收起为封面小方块，点方块右缘收缩键展开。
   不要加手机端强制展开的样式——启动时的类切换会触发CSS过渡，
   在 iframe 节流环境下会冻结在起始帧，导致按钮堆叠在封面左侧 */
</style>
</head>
<body>
<div id="musicPlayer"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
var musicPlayer = new APlayer({
    container: document.getElementById('musicPlayer'),
    fixed: true,
    mini: true,
    autoplay: false,
    theme: '#e3f2f5',
    loop: 'all',
    order: 'random',
    preload: 'auto',
    volume: 0.4,
    mutex: true,
    listFolded: true,
    listMaxHeight: 320,
    audio: [
        { name: '样YOUNG', url: '../MUSIC/样YOUNG.mp3' },
        { name: '蒲公英的约定', url: '../MUSIC/蒲公英的约定.mp3' },
        { name: '我怀念的', url: '../MUSIC/我怀念的.mp3' },
        { name: '赐我', url: '../MUSIC/赐我.mp3' },
        { name: '空空', url: '../MUSIC/空空.mp3' },
        { name: '大眠', url: '../MUSIC/大眠.mp3' },
        { name: '同花顺', url: '../MUSIC/同花顺.mp3' },
        { name: '遇见', url: '../MUSIC/遇见.mp3' },
        { name: '撒野', url: '../MUSIC/撒野.mp3' },
        { name: '春よ,来い', url: '../MUSIC/春よ,来い.mp3' },
        { name: 'Merry Christmas, Mr.Lawrence', url: '../MUSIC/Merry Christmas, Mr.Lawrence.mp3' },
        { name: '乌托邦', url: '../MUSIC/乌托邦.mp3' },
        { name: 'One Last Kiss', url: '../MUSIC/One Last Kiss.mp3' }
    ]
});

// 手机端不做任何强制展开干预，保持与电脑端一致的原生默认收起态。
// 历史教训：启动时强制 setMode('normal')/移除窄条类会触发 CSS 过渡，
// 在 iframe 节流环境下冻结在起始帧，导致按钮堆叠在封面左侧、进度条被挤出可视区。

// 双端通用：去掉无功能的歌词(lrc)图标，把 单曲循环/顺序播放/随机播放 合并为一个可点击切换的按钮
(function() {
    var loopIcon = document.querySelector('.aplayer-icon-loop');
    var orderIcon = document.querySelector('.aplayer-icon-order');
    var lrcIcon = document.querySelector('.aplayer-icon-lrc');
    if (!loopIcon || !orderIcon || !lrcIcon) return;

    var modes = ['one', 'order', 'random'];   // 单曲循环 → 顺序播放 → 随机播放
    var modeNames = { one: '单曲循环', order: '顺序播放', random: '随机播放' };
    var current = 'random';                    // 对应初始配置 loop:'all' + order:'random'

    function applyMode(target) {
        var guard = 0;
        var targetLoop = (target === 'one') ? 'one' : 'all';
        while (musicPlayer.options.loop !== targetLoop && guard++ < 4) loopIcon.click();
        if (target !== 'one' && musicPlayer.options.order !== target) orderIcon.click();
    }

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'aplayer-icon';
    function refreshIcon() {
        btn.innerHTML = (current === 'one' ? loopIcon : orderIcon).innerHTML;
        btn.title = '播放模式：' + modeNames[current];
    }
    btn.addEventListener('click', function() {
        current = modes[(modes.indexOf(current) + 1) % modes.length];
        applyMode(current);
        refreshIcon();
    });

    lrcIcon.parentNode.insertBefore(btn, lrcIcon);
    lrcIcon.style.display = 'none';
    loopIcon.style.display = 'none';
    orderIcon.style.display = 'none';
    refreshIcon();
})();

musicPlayer.on('listshow', function() {
    window.parent.postMessage({ type: 'aplayerResize', height: 450 }, '*');
    setTimeout(function() {
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        if (list) {
            list.style.maxHeight = '350px';
            list.style.height = '350px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = '350px';
            listWrap.style.height = '350px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 100);
});

musicPlayer.on('listhide', function() {
    window.parent.postMessage({ type: 'aplayerResize', height: 77 }, '*');
});

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        if (list) {
            list.style.maxHeight = '320px';
            list.style.height = '320px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = '320px';
            listWrap.style.height = '320px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 500);
});

function addWheelPrevent(element) {
    element.addEventListener('wheel', function(e) {
        var scrollTop = element.scrollTop;
        var scrollHeight = element.scrollHeight;
        var clientHeight = element.clientHeight;
        
        if ((scrollTop === 0 && e.deltaY < 0) || 
            (scrollTop >= scrollHeight - clientHeight - 1 && e.deltaY > 0)) {
            e.preventDefault();
        }
        e.stopPropagation();
    }, { passive: false });
}
</script>
</body>
</html>
