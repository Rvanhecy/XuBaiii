<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.aplayer-list {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: relative !important;
}
.aplayer-list-wrap {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
}
.aplayer-list::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list-wrap::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list li {
    height: 32px !important;
    line-height: 32px !important;
}
.aplayer {
    overflow: visible !important;
}
.aplayer-withlrc {
    overflow: visible !important;
}

/* ===== 移动端播放器适配 ===== */
@media (max-width: 768px) {
    .aplayer,
    .aplayer .aplayer-body {
        max-width: 100% !important;
        width: 100% !important;
    }
    .aplayer .aplayer-body {
        display: flex !important;
        align-items: center !important;
        padding-right: 0 !important;
    }
    .aplayer .aplayer-pic {
        width: 48px !important;
        height: 48px !important;
        min-width: 48px !important;
        float: none !important;
        flex-shrink: 0 !important;
    }
    .aplayer .aplayer-pic .aplayer-play {
        width: 24px !important;
        height: 24px !important;
        margin: -12px -12px 0 0 !important;
    }
    .aplayer .aplayer-pic .aplayer-play svg {
        width: 14px !important;
        height: 14px !important;
    }
    .aplayer .aplayer-info {
        margin-left: 0 !important;
        padding: 4px 8px !important;
        height: 48px !important;
        flex: 1 !important;
        min-width: 0 !important;
        transform: none !important;
        -webkit-transform: none !important;
    }
    .aplayer .aplayer-music {
        margin: 0 0 4px 0 !important;
        height: 14px !important;
        line-height: 14px !important;
    }
    .aplayer .aplayer-title {
        font-size: 12px !important;
    }
    .aplayer .aplayer-author {
        display: none !important;
    }
    .aplayer .aplayer-controller {
        display: flex !important;
        align-items: center !important;
    }
    .aplayer .aplayer-bar-wrap {
        flex: 1 !important;
        min-width: 0 !important;
        margin: 0 !important;
    }
    /* 覆盖绝对定位按钮，改为普通流 */
    .aplayer .aplayer-icon-back,
    .aplayer .aplayer-icon-play,
    .aplayer .aplayer-icon-forward,
    .aplayer .aplayer-icon-menu {
        position: static !important;
        right: auto !important;
        bottom: auto !important;
        width: 18px !important;
        height: 18px !important;
        margin: 0 1px !important;
        flex-shrink: 0 !important;
    }
    .aplayer .aplayer-icon svg {
        width: 14px !important;
        height: 14px !important;
    }
    .aplayer .aplayer-icon-volume,
    .aplayer .aplayer-icon-volume-down,
    .aplayer .aplayer-volume-wrap {
        display: none !important;
    }
    .aplayer .aplayer-time {
        display: flex !important;
        align-items: center !important;
        font-size: 9px !important;
        padding: 0 !important;
        margin-left: 3px !important;
        height: 17px !important;
        flex-shrink: 0 !important;
    }
    .aplayer .aplayer-miniswitcher {
        display: none !important;
    }
    .aplayer-list {
        max-height: 45vh !important;
        height: 45vh !important;
    }
    .aplayer-list-wrap {
        max-height: 45vh !important;
        height: 45vh !important;
    }
    .aplayer-list li {
        height: 36px !important;
        line-height: 36px !important;
    }
}
</style>
</head>
<body>
<div id="musicPlayer"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
var musicPlayer = new APlayer({
    container: document.getElementById('musicPlayer'),
    fixed: true,
    mini: true,
    autoplay: false,
    theme: '#e3f2f5',
    loop: 'all',
    order: 'random',
    preload: 'auto',
    volume: 0.4,
    mutex: true,
    listFolded: true,
    listMaxHeight: 320,
    audio: [
        { name: '样YOUNG', url: '../MUSIC/样YOUNG.mp3' },
        { name: '蒲公英的约定', url: '../MUSIC/蒲公英的约定.mp3' },
        { name: '我怀念的', url: '../MUSIC/我怀念的.mp3' },
        { name: '赐我', url: '../MUSIC/赐我.mp3' },
        { name: '空空', url: '../MUSIC/空空.mp3' },
        { name: '大眠', url: '../MUSIC/大眠.mp3' },
        { name: '同花顺', url: '../MUSIC/同花顺.mp3' },
        { name: '遇见', url: '../MUSIC/遇见.mp3' },
        { name: '撒野', url: '../MUSIC/撒野.mp3' },
        { name: '春よ,来い', url: '../MUSIC/春よ,来い.mp3' },
        { name: 'Merry Christmas, Mr.Lawrence', url: '../MUSIC/Merry Christmas, Mr.Lawrence.mp3' },
        { name: '乌托邦', url: '../MUSIC/乌托邦.mp3' },
        { name: 'One Last Kiss', url: '../MUSIC/One Last Kiss.mp3' }
    ]
});

// 移动端强制覆盖 APlayer 布局
function fixMobileLayout() {
    if (window.innerWidth > 768) return;
    var body = document.querySelector('.aplayer-body');
    if (!body) return;
    body.style.display = 'flex';
    body.style.alignItems = 'center';
    body.style.width = '100%';
    body.style.maxWidth = '100%';
    body.style.paddingRight = '0';

    var pic = document.querySelector('.aplayer-pic');
    if (pic) {
        pic.style.width = '48px';
        pic.style.height = '48px';
        pic.style.minWidth = '48px';
        pic.style.cssFloat = 'none';
        pic.style.flexShrink = '0';
    }

    var info = document.querySelector('.aplayer-info');
    if (info) {
        info.style.marginLeft = '0';
        info.style.padding = '4px 8px';
        info.style.height = '48px';
        info.style.flex = '1';
        info.style.minWidth = '0';
        info.style.transform = 'none';
        info.style.webkitTransform = 'none';
    }

    var icons = document.querySelectorAll('.aplayer-icon-back, .aplayer-icon-play, .aplayer-icon-forward, .aplayer-icon-menu');
    icons.forEach(function(icon) {
        icon.style.position = 'static';
        icon.style.right = 'auto';
        icon.style.bottom = 'auto';
        icon.style.width = '18px';
        icon.style.height = '18px';
        icon.style.margin = '0 1px';
        icon.style.flexShrink = '0';
    });

    var volume = document.querySelector('.aplayer-volume-wrap');
    if (volume) volume.style.display = 'none';

    var miniswitcher = document.querySelector('.aplayer-miniswitcher');
    if (miniswitcher) miniswitcher.style.display = 'none';
}

setTimeout(fixMobileLayout, 800);
setTimeout(fixMobileLayout, 2000);
window.addEventListener('resize', fixMobileLayout);

function isMobile() {
    return window.innerWidth <= 768;
}

function getListHeight() {
    return isMobile() ? Math.floor(window.innerHeight * 0.45) : 320;
}

musicPlayer.on('listshow', function() {
    var expandH = (isMobile() ? 48 : 77) + getListHeight() + 10;
    window.parent.postMessage({ type: 'aplayerResize', height: expandH }, '*');
    setTimeout(function() {
        var listH = getListHeight();
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        if (list) {
            list.style.maxHeight = listH + 'px';
            list.style.height = listH + 'px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = listH + 'px';
            listWrap.style.height = listH + 'px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 100);
});

musicPlayer.on('listhide', function() {
    window.parent.postMessage({ type: 'aplayerResize', height: isMobile() ? 48 : 77 }, '*');
});

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        fixMobileLayout();
        var listH = getListHeight();
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        if (list) {
            list.style.maxHeight = listH + 'px';
            list.style.height = listH + 'px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = listH + 'px';
            listWrap.style.height = listH + 'px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 500);
});

function addWheelPrevent(element) {
    element.addEventListener('wheel', function(e) {
        var scrollTop = element.scrollTop;
        var scrollHeight = element.scrollHeight;
        var clientHeight = element.clientHeight;
        
        if ((scrollTop === 0 && e.deltaY < 0) || 
            (scrollTop >= scrollHeight - clientHeight - 1 && e.deltaY > 0)) {
            e.preventDefault();
        }
        e.stopPropagation();
    }, { passive: false });
}
</script>
</body>
</html>
