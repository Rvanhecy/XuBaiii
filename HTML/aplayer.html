<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.aplayer-list {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: relative !important;
}
.aplayer-list-wrap {
    max-height: 320px !important;
    height: 320px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
}
.aplayer-list::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list-wrap::-webkit-scrollbar {
    width: 8px !important;
    display: block !important;
}
.aplayer-list::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.5) !important;
    border-radius: 4px !important;
}
.aplayer-list::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list-wrap::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.7) !important;
}
.aplayer-list li {
    height: 32px !important;
    line-height: 32px !important;
}
.aplayer {
    overflow: visible !important;
}
.aplayer-withlrc {
    overflow: visible !important;
}
@media (max-width: 768px) {
    .aplayer-list {
        max-height: 45vh !important;
        height: 45vh !important;
    }
    .aplayer-list-wrap {
        max-height: 45vh !important;
        height: 45vh !important;
    }
    .aplayer-list li {
        height: 36px !important;
        line-height: 36px !important;
    }
    /* 迷你播放器移动端适配 - 用 flexbox 重写布局 */
    .aplayer.aplayer-fixed.aplayer-mini {
        max-width: 100% !important;
        width: 100% !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-body {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        max-width: 100% !important;
        width: 100% !important;
        padding-right: 0 !important;
        height: 60px !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-pic {
        width: 50px !important;
        height: 50px !important;
        min-width: 50px !important;
        float: none !important;
        flex-shrink: 0 !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-pic .aplayer-play {
        width: 26px !important;
        height: 26px !important;
        margin: -13px -13px 0 0 !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-pic .aplayer-play svg {
        width: 16px !important;
        height: 16px !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-info {
        margin-left: 0 !important;
        padding: 4px 8px !important;
        height: 50px !important;
        flex: 1 !important;
        min-width: 0 !important;
        transform: none !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-music {
        height: 16px !important;
        line-height: 16px !important;
        margin: 0 0 4px 0 !important;
        width: 100% !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-title {
        font-size: 12px !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-author {
        display: none !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-controller {
        display: flex !important;
        align-items: center !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-bar-wrap {
        flex: 1 !important;
        min-width: 0 !important;
        margin: 0 !important;
    }
    /* 覆盖 APlayer fixed 模式的绝对定位，改为普通流 */
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-back,
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-play,
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-forward,
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-menu {
        position: static !important;
        right: auto !important;
        bottom: auto !important;
        width: 20px !important;
        height: 20px !important;
        margin: 0 2px !important;
        flex-shrink: 0 !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon svg {
        width: 16px !important;
        height: 16px !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-volume,
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-icon-volume-down,
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-volume-wrap {
        display: none !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-time {
        display: flex !important;
        align-items: center !important;
        font-size: 10px !important;
        padding: 0 !important;
        height: 17px !important;
        margin-left: 4px !important;
        flex-shrink: 0 !important;
    }
    .aplayer.aplayer-fixed.aplayer-mini .aplayer-miniswitcher {
        display: none !important;
    }
}
</style>
</head>
<body>
<div id="musicPlayer"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
var musicPlayer = new APlayer({
    container: document.getElementById('musicPlayer'),
    fixed: true,
    mini: true,
    autoplay: false,
    theme: '#e3f2f5',
    loop: 'all',
    order: 'random',
    preload: 'auto',
    volume: 0.4,
    mutex: true,
    listFolded: true,
    listMaxHeight: 320,
    audio: [
        { name: '样YOUNG', url: '../MUSIC/样YOUNG.mp3' },
        { name: '蒲公英的约定', url: '../MUSIC/蒲公英的约定.mp3' },
        { name: '我怀念的', url: '../MUSIC/我怀念的.mp3' },
        { name: '赐我', url: '../MUSIC/赐我.mp3' },
        { name: '空空', url: '../MUSIC/空空.mp3' },
        { name: '大眠', url: '../MUSIC/大眠.mp3' },
        { name: '同花顺', url: '../MUSIC/同花顺.mp3' },
        { name: '遇见', url: '../MUSIC/遇见.mp3' },
        { name: '撒野', url: '../MUSIC/撒野.mp3' },
        { name: '春よ,来い', url: '../MUSIC/春よ,来い.mp3' },
        { name: 'Merry Christmas, Mr.Lawrence', url: '../MUSIC/Merry Christmas, Mr.Lawrence.mp3' },
        { name: '乌托邦', url: '../MUSIC/乌托邦.mp3' },
        { name: 'One Last Kiss', url: '../MUSIC/One Last Kiss.mp3' }
    ]
});

function isMobile() {
    return window.innerWidth <= 768;
}

function getMiniHeight() {
    return isMobile() ? 60 : 77;
}

function getListHeight() {
    return isMobile() ? Math.floor(window.innerHeight * 0.45) : 320;
}

function getExpandHeight() {
    return getMiniHeight() + getListHeight() + 10;
}

musicPlayer.on('listshow', function() {
    var expandH = getExpandHeight();
    window.parent.postMessage({ type: 'aplayerResize', height: expandH }, '*');
    setTimeout(function() {
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        var listH = getListHeight();
        if (list) {
            list.style.maxHeight = listH + 'px';
            list.style.height = listH + 'px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = listH + 'px';
            listWrap.style.height = listH + 'px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 100);
});

musicPlayer.on('listhide', function() {
    window.parent.postMessage({ type: 'aplayerResize', height: getMiniHeight() }, '*');
});

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        var list = document.querySelector('.aplayer-list');
        var listWrap = document.querySelector('.aplayer-list-wrap');
        var listH = getListHeight();
        if (list) {
            list.style.maxHeight = listH + 'px';
            list.style.height = listH + 'px';
            list.style.overflowY = 'auto';
            list.style.overflowX = 'hidden';
            addWheelPrevent(list);
        }
        if (listWrap) {
            listWrap.style.maxHeight = listH + 'px';
            listWrap.style.height = listH + 'px';
            listWrap.style.overflowY = 'auto';
            listWrap.style.overflowX = 'hidden';
            addWheelPrevent(listWrap);
        }
    }, 500);
});

window.addEventListener('resize', function() {
    var frame = window.frameElement;
    if (frame) {
        var listEl = document.querySelector('.aplayer-list');
        var isListShown = listEl && listEl.offsetHeight > 0;
        var h = isListShown ? getExpandHeight() : getMiniHeight();
        window.parent.postMessage({ type: 'aplayerResize', height: h }, '*');
    }
});

function addWheelPrevent(element) {
    element.addEventListener('wheel', function(e) {
        var scrollTop = element.scrollTop;
        var scrollHeight = element.scrollHeight;
        var clientHeight = element.clientHeight;
        
        if ((scrollTop === 0 && e.deltaY < 0) || 
            (scrollTop >= scrollHeight - clientHeight - 1 && e.deltaY > 0)) {
            e.preventDefault();
        }
        e.stopPropagation();
    }, { passive: false });
}
</script>
</body>
</html>
